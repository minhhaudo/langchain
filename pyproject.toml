[project]
name = "langchain-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "minhhaudo", email = "minhhaudo1309@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langgraph-cli>=0.4.38",
    "python-dotenv>=1.2.4",
    "tavily>=1.1.0",
]

[project.scripts]
langchain-learn = "langchain_learn:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
